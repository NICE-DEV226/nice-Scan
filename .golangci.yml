# nice-Scan lint configuration
# Enforced in CI: any issue fails the build.
version: "2"

linters:
  default: standard
  enable:
    - staticcheck
    - unconvert
    - unparam
    - errorlint

# Formatting is a gate too: CI fails on unformatted files.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
