name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # go1.26 releases carry the net/http + crypto/x509 fixes for GO-2026-6613,
  # GO-2026-6617 and GO-2026-6809 — the stdlib versions that govulncheck
  # (see below) gates the pipeline on. Keep in sync with release.yml.
  GO_VERSION: "1.26.10"

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Supply-chain hardening: every third-party action is pinned to the
      # exact commit SHA of its release tag (tag -> commit resolved from the
      # GitHub API), so workflow runs cannot be moved by retargeting tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
          skip-cache: true

      - name: Build
        run: go build -v ./...

      - name: Test with Race Detection
        run: go test -race -count=1 ./...

      # Vulnerability scan of the dependency graph AND of Go itself.
      # Run through a checksum-verified module install because govulncheck
      # executes on the build machine: `go run <module>@<version>` fetches
      # through the module proxy with sum.golang.org verification, pinning
      # the exact tool version.
      - name: Vulnerability Scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...
